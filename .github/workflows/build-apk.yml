name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy fonts into the app
        run: node tools/prepare.js

      - name: Create the Android project
        run: npx cap add android

      - name: Apply icon and theme
        run: node tools/patch-android.js

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hunter-Seriph.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hunter-Seriph-apk
          path: Hunter-Seriph.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Hunter-Seriph.apk \
            --title "Hunter Seriph app, build ${{ github.run_number }}" \
            --notes "Download Hunter-Seriph.apk on your Android phone and tap it to install." \
            --latest
